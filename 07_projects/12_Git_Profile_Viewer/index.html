<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GitHub Profile Viewer</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container">
      <header class="header">
        <div class="header-content">
          <h1><i class="fab fa-github"></i> GitHub Profile Viewer</h1>
          <p>Discover and explore GitHub profiles with style</p>
        </div>
      </header>

      <div class="search-section">
        <div class="search-container">
          <div class="search-box">
            <i class="fas fa-search search-icon"></i>
            <input
              type="text"
              id="usernameInput"
              placeholder="Enter GitHub username..."
              autocomplete="off"
            />
            <button id="searchBtn" class="search-btn">
              <span class="btn-text">Search</span>
              <div class="loading-spinner"></div>
            </button>
          </div>
          <div class="suggestions">
            <span class="suggestion-label">Try:</span>
            <button class="suggestion-btn" data-username="princekapar">
              princekapar
            </button>
            <button class="suggestion-btn" data-username="hiteshchoudhary">
              hiteshcoudhary
            </button>
            <button class="suggestion-btn" data-username="hkirat">
              hkirat
            </button>
          </div>
        </div>
      </div>

      <div id="errorMessage" class="error-message">
        <i class="fas fa-exclamation-triangle"></i>
        <span id="errorText"></span>
      </div>

      <div id="profileContainer" class="profile-container">
        <div class="profile-card">
          <div class="profile-header">
            <div class="avatar-container">
              <img
                id="avatar"
                src="/placeholder.svg"
                alt="Profile Avatar"
                class="avatar"
              />
              <div class="avatar-ring"></div>
            </div>
            <div class="profile-info">
              <h2 id="name" class="profile-name"></h2>
              <p id="username" class="profile-username"></p>
              <p id="bio" class="profile-bio"></p>
              <div class="profile-meta">
                <div class="meta-item">
                  <i class="fas fa-map-marker-alt"></i>
                  <span id="location"></span>
                </div>

                <div class="meta-item">
                  <i class="fas fa-link"></i>
                  <a id="blog" href="" target="_blank"></a>
                </div>

                <div class="meta-item">
                  <i class="fab fa-twitter"></i>
                  <a id="twitter" href="" target="_blank"></a>
                </div>

                <div class="meta-item">
                  <i class="fas fa-calendar-alt"></i>
                  <span id="joinDate"></span>
                </div>
              </div>

              <a id="profileLink" href="" target="_blank" class="profile-link">
                <i class="fab fa-github"></i>
                View on GitHub
              </a>
            </div>
          </div>

          <div class="stats-container">
            <div class="stat-card">
              <div class="stat-number" id="publicRepos">0</div>
              <div class="stat-label">Repositories</div>
            </div>
            <div class="stat-card">
              <div class="stat-number" id="followers">0</div>
              <div class="stat-label">Followers</div>
            </div>
            <div class="stat-card">
              <div class="stat-number" id="following">0</div>
              <div class="stat-label">Following</div>
            </div>
            <div class="stat-card">
              <div class="stat-number" id="publicGists">0</div>
              <div class="stat-label">Gists</div>
            </div>
          </div>
        </div>

        <div class="repos-section">
          <h3 class="section-title">
            <i class="fas fa-code-branch"></i>
            Popular Repositories
          </h3>
          <div id="reposContainer" class="repos-container">
            <!-- Repositories will be loaded here -->
          </div>
        </div>
      </div>
    </div>

    <footer class="footer">
      <p>&copy; 2025 GitHub Profile Viewer. Built with ❤️ using GitHub API</p>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
